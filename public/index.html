<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nhậu Đêm 134 · Quán nhậu online</title>
    <meta name="description" content="Quán nhậu vỉa hè ảo cho TikTok LIVE: chat nhậu là có ghế, gõ tên món là bếp nấu rồi bưng ra bàn, tặng quà có lẩu, đập quán, bao cả quán." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍻</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap&subset=vietnamese" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      // ?view=stage: the live stage (Link source in TikTok LIVE Studio); anything else: the admin page.
      // Each page loads only its own stylesheet, so their class names never clash.
      const stage = new URLSearchParams(location.search).get('view') === 'stage';
      const css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = stage ? '/css/stage.css' : '/css/dashboard.css';
      document.head.appendChild(css);
      import(stage ? '/js/stage.js' : '/js/dashboard.js');
    </script>
  </body>
</html>
